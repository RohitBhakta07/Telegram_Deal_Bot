<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { p: '#0da2e7', dark: '#080e14', card: '#0e1822', edge: '#172032' }, fontFamily: { display: ['Syne', 'sans-serif'] } } } }</script>
</head>

<body class="bg-dark text-slate-200 min-h-screen dot-grid flex items-center justify-center p-4">
    <div class="corner-glow -top-20 -left-20"
        style="background:radial-gradient(circle,rgba(13,162,231,0.09) 0%,transparent 70%)"></div>
    <div class="corner-glow -bottom-20 -right-20"
        style="background:radial-gradient(circle,rgba(168,85,247,0.07) 0%,transparent 70%)"></div>

    <div class="w-full max-w-sm fade-up">
        <div class="text-center mb-8">
            <div
                class="inline-flex size-14 rounded-2xl accent-bar items-center justify-center shadow-2xl shadow-p/25 mb-4">
                <span class="material-symbols-outlined text-white text-[28px]">rocket_launch</span>
            </div>
            <h1 class="text-2xl font-display font-bold text-white">Deal Hunter Bot</h1>
            <p class="text-slate-500 text-sm mt-1">Super Admin Access</p>
        </div>

        <div class="bg-card border border-edge rounded-2xl p-7 shadow-2xl">
            {% if error %}
            <div class="mb-5 px-4 py-2.5 rounded-xl text-sm flex items-center gap-2 flash-error slide-down">
                <span class="material-symbols-outlined text-[17px]">error</span>{{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('super_admin.login') }}">
                <div class="mb-6">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">Admin
                        Password</label>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-[19px]">lock</span>
                        <input type="password" name="password" id="sa-pass" required autofocus
                            placeholder="Enter password" class="input-field pl-10 pr-12">
                        <button type="button" onclick="togglePasswordVisibility('sa-pass','sa-eye')"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors">
                            <span class="material-symbols-outlined text-[19px]" id="sa-eye">visibility_off</span>
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full accent-bar text-white font-semibold py-3 rounded-xl text-sm
                       shadow-lg shadow-p/20 hover:opacity-90 active:scale-[0.98] transition-all
                       flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-[18px]">login</span>Access Panel
                </button>
            </form>
        </div>
        <p class="text-center text-xs text-slate-600 mt-5">Deal Hunter Bot — Admin Panel v2.0</p>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
