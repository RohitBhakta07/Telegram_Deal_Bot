{% extends 'super_admin/base.html' %}
{% block title %}Live Console{% endblock %}
{% block page_title %}Live Console{% endblock %}
{% block page_subtitle %}Real-time bot log — all channels{% endblock %}

{% block content %}
<div class="p-7 flex flex-col fade-up" style="height:calc(100vh - 80px)">

    <!-- Toolbar -->
    <div class="flex items-center justify-between mb-4 flex-shrink-0">
        <div class="flex items-center gap-3">
            <span class="size-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="text-sm text-slate-400" id="console-status">Connecting…</span>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="DealConsole.togglePause(this)" id="pause-btn" class="btn btn-ghost text-xs px-3 py-1.5">
                <span class="material-symbols-outlined text-[16px]">pause</span> Pause
            </button>
            <button onclick="DealConsole.clearLog()" class="btn btn-ghost text-xs px-3 py-1.5">
                <span class="material-symbols-outlined text-[16px]">delete_sweep</span> Clear
            </button>
        </div>
    </div>

    <!-- Console -->
    <div id="console-box"
        class="flex-1 bg-dark border border-edge rounded-2xl p-5 overflow-y-auto font-mono text-xs leading-relaxed">
        <div id="log-output" class="space-y-0.5"></div>
        <span class="inline-block w-2 h-3.5 bg-p animate-pulse ml-0.5 align-middle"></span>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        DealConsole.init(
            "{{ url_for('super_admin.log_stream') }}",
            'log-output',
            'console-status'
        );
    });
</script>
{% endblock %}
