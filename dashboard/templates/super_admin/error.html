<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ code or '' }} — Deal Hunter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { dark: '#080e14' }, fontFamily: { display: ['Syne', 'sans-serif'] } } } }</script>
</head>

<body class="bg-dark dot-grid text-slate-200 min-h-screen flex items-center justify-center p-4">
    <div class="text-center max-w-sm fade-up">
        <p class="font-display text-8xl font-extrabold text-slate-800 leading-none mb-2">{{ code or '?' }}</p>
        <span class="material-symbols-outlined text-5xl text-red-500 mb-4 block">
            {{ 'link_off' if code == 404 else 'error' }}
        </span>
        <h1 class="text-xl font-display font-bold text-white mb-2">
            {{ 'Page Not Found' if code == 404 else 'Something Went Wrong' }}
        </h1>
        <p class="text-sm text-slate-500 mb-6">{{ message }}</p>
        <a href="/" class="inline-flex items-center gap-2 text-sm text-p hover:underline">
            <span class="material-symbols-outlined text-[16px]">arrow_back</span> Back to Dashboard
        </a>
    </div>
</body>

</html>
