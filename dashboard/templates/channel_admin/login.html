<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ panel_name }} — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode:'class',
      theme:{ extend:{ colors:{ dark:'#080e14', card:'#0e1822', edge:'#172032' },
        fontFamily:{ display:['Syne','sans-serif'], body:['DM Sans','sans-serif'] } } }
    }
  </script>
  <style>
    body { font-family:'DM Sans',sans-serif; }
    h1,h2 { font-family:'Syne',sans-serif; }
    .dot-grid {
      background-image: radial-gradient(circle, #1a2840 1px, transparent 1px);
      background-size: 28px 28px;
    }
    .accent-bar { background: linear-gradient(135deg, #0891b2, #0ea5e9, #6366f1); }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .fade-up { animation: fadeUp 0.4s ease forwards; }
    .glow-ring:focus { box-shadow: 0 0 0 3px rgba(8,145,178,0.25); }
    .corner-glow { position:absolute; width:280px; height:280px; border-radius:50%;
      pointer-events:none; }
  </style>
</head>
<body class="bg-dark text-slate-200 min-h-screen dot-grid flex items-center justify-center p-4">

  <div class="corner-glow top-[-80px] left-[-80px]"
       style="background:radial-gradient(circle,rgba(8,145,178,0.09) 0%,transparent 70%)"></div>
  <div class="corner-glow bottom-[-80px] right-[-80px]"
       style="background:radial-gradient(circle,rgba(99,102,241,0.08) 0%,transparent 70%)"></div>

  <div class="w-full max-w-sm fade-up">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex size-14 rounded-2xl accent-bar items-center justify-center
                  shadow-2xl shadow-cyan-500/25 mb-4">
        <span class="material-symbols-outlined text-white text-[28px]">local_offer</span>
      </div>
      <h1 class="text-2xl font-bold text-white">{{ panel_name }}</h1>
      <p class="text-slate-500 text-sm mt-1">Channel Admin Panel</p>
    </div>

    <!-- Card -->
    <div class="bg-card border border-edge rounded-2xl p-7 shadow-2xl">

      {% if error %}
      <div class="mb-5 px-4 py-2.5 rounded-lg text-sm flex items-center gap-2
                  bg-red-950 border-l-2 border-red-500 text-red-300">
        <span class="material-symbols-outlined text-[17px]">error</span>
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('channel_admin.login', slug=slug) }}">
        <!-- Username -->
        <div class="mb-4">
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1.5">
            Username
          </label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2
                         text-slate-500 text-[19px]">person</span>
            <input type="text" name="username" required autofocus
                   placeholder="Enter your username"
                   class="w-full bg-dark border border-edge rounded-xl pl-10 pr-4 py-3
                          text-white placeholder-slate-600 text-sm
                          focus:outline-none focus:border-cyan-500 glow-ring transition-all">
          </div>
        </div>

        <!-- Password -->
        <div class="mb-6">
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1.5">
            Password
          </label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2
                         text-slate-500 text-[19px]">lock</span>
            <input type="password" name="password" id="password" required
                   placeholder="••••••••"
                   class="w-full bg-dark border border-edge rounded-xl pl-10 pr-12 py-3
                          text-white placeholder-slate-600 text-sm
                          focus:outline-none focus:border-cyan-500 glow-ring transition-all">
            <button type="button" onclick="togglePass()"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
              <span class="material-symbols-outlined text-[19px]" id="eye-icon">visibility_off</span>
            </button>
          </div>
        </div>

        <button type="submit"
                class="w-full accent-bar text-white font-semibold py-3 rounded-xl text-sm
                       hover:opacity-90 active:scale-[0.98] transition-all duration-150
                       flex items-center justify-center gap-2 shadow-lg shadow-cyan-500/20">
          <span class="material-symbols-outlined text-[18px]">login</span>
          Access My Panel
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-slate-600 mt-5">
      Deal Hunter Bot &mdash; Channel Admin v2.0
    </p>
  </div>

  <script>
    function togglePass() {
      const inp = document.getElementById('password');
      const ico = document.getElementById('eye-icon');
      inp.type = inp.type === 'password' ? 'text' : 'password';
      ico.textContent = inp.type === 'password' ? 'visibility_off' : 'visibility';
    }
  </script>
</body>
</html>
